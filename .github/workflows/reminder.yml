name: LINE 代辦提醒排程

on:
  schedule:
    # 台灣時間 08:17 ~ 18:47 之間，每 30 分鐘檢查一次（UTC 00:17 ~ 10:47）。
    # 故意避開整點，因為 GitHub 整點最擁擠、延遲最嚴重。
    # 程式有「這個時段已提醒過就不重發」的保護，密集檢查不會造成重複推播；
    # 就算 GitHub 延遲或跳過其中幾次，後面的檢查也會自動補發。
    - cron: "17,47 0-10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "測試用：勾選後忽略提醒時段，立刻把所有未完成事項發到群組（不影響正式排程）"
        type: boolean
        default: false

# 避免兩次執行同時進行（可能造成重複推播）
concurrency:
  group: line-reminder
  cancel-in-progress: false

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行提醒檢查
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          FORCE_SEND: ${{ inputs.force }}
        run: python reminder_check.py
