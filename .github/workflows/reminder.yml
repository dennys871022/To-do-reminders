name: Discord 代辦提醒排程

# 【改版重點】拿掉 GitHub 自己的 schedule 排程，因為實測發現 GitHub 免費方案
# 對排程觸發做了嚴格節流，設定的頻率大部分都被跳過，不可靠。
# 改成完全依賴外部服務（cron-job.org）在準確的 3 個時間點，呼叫 GitHub REST API
# 的 workflow_dispatch 來觸發這支 workflow——workflow_dispatch 走的是手動觸發
# 路徑，幾乎是即時執行，不會卡在 GitHub 的排程佇列裡。
on:
  workflow_dispatch:
    inputs:
      force:
        description: "測試用：勾選後忽略提醒時段，立刻把所有未完成事項發到頻道（不影響正式排程）"
        type: boolean
        default: false

# 避免兩次執行同時進行（可能造成重複推播）
concurrency:
  group: discord-reminder
  cancel-in-progress: false

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行提醒檢查
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_SEND: ${{ inputs.force }}
        run: python reminder_check.py
